name: Publish to GitHub Pages

# Deploys the repository root as a static site on every push to main.
# Pages must be switched on once by hand (Settings → Pages → Source:
# GitHub Actions): `enablement: true` would do it, but GITHUB_TOKEN is not
# allowed to create a Pages site, so the first run fails until then.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
